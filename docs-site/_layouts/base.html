<!DOCTYPE html>
<html lang="{{language}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               form-action 'self';
               frame-ancestors 'none';
               manifest-src 'self';"
    />

    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{permalink}}" />
    <meta property="og:locale" content="{{language}}" />
    <meta property="og:image" content="{{site_url}}images/screenshot.png" />
    <meta property="og:image:width" content="1500" />
    <meta property="og:image:height" content="1000" />
    <meta property="og:image:alt" content="{{screenshot_alt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{site_url}}images/screenshot.png" />
    <meta name="twitter:image:alt" content="{{screenshot_alt}}" />

    <link rel="canonical" href="{{permalink}}" />
    <link rel="icon" href="{{base_path}}favicon.ico" sizes="any" />
    <link rel="icon" href="{{base_path}}assets/logo.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "TechArticle",
          "@id": "{{permalink}}#article",
          "headline": "{{headline}}",
          "description": "{{description}}",
          "inLanguage": "{{language}}",
          "url": "{{permalink}}",
          "author": { "@type": "Organization", "name": "{{author}}" }
        },
        {
          "@type": "WebSite",
          "@id": "{{site_url}}#website",
          "url": "{{site_url}}",
          "name": "{{name}}",
          "description": "{{description}}",
          "inLanguage": "{{language}}"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="{{base_path}}styles.css" />
    <script src="{{base_path}}theme-init.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">{{label_skip}}</a>
    {{> header}}
    <main id="main">
      {{#block "main"}}{{/block}}
    </main>
    {{> footer}}
    <script src="{{base_path}}main.js" defer></script>
  </body>
</html>
