name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    uses: sebastienrousseau/pipelines/.github/workflows/labeler.yml@7061363af0a1da9d60c5901bd2874ac83ff7e34e
    with:
      config-path: '.github/labeler.yml'
