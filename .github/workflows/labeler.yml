name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    uses: sebastienrousseau/pipelines/.github/workflows/labeler.yml@41d9a0d3043c8a289cc06ac3a84e0ac1b1814b71
    with:
      config-path: '.github/labeler.yml'
