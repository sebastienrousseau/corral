name: Secret Scan

# Gitleaks over the full history on every push and pull request.
#
# SECURITY.md has claimed "Gitleaks scans run on every push and pull request"
# since the policy was written, and until this workflow existed that claim was
# false — no job in this repository, and none in the reusable pipelines it
# calls, ever ran gitleaks. A security policy that overstates its controls is
# worse than one that omits them, so the fix is the scan, not a smaller claim.
#
# The binary is fetched from the pinned upstream release and verified against
# its published SHA-256 before it runs. `gitleaks/gitleaks-action` would be
# fewer lines, but it is a mutable third-party action in the credential path
# of a secret scanner, and this repository pins by digest everywhere else.
#
# `--redact` matters: a finding is a leaked credential, and the job log is
# readable by anyone who can see the repository. Report the location, never
# the value.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly, so a secret committed before this existed is still found.

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the release's
      # own gitleaks_8.30.1_checksums.txt. Update both together.
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A secret is leaked by the commit that introduced it, which may be
          # far behind HEAD. Scanning a shallow clone would only ever find
          # secrets added in the last commit.
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl --fail --silent --show-error --location --retry 3 -o "${RUNNER_TEMP}/${asset}" "${url}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" version

      - name: Scan repository history
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks/gitleaks" git . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
