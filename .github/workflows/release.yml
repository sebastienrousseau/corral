name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Required so goreleaser can push the Docker image to
      # ghcr.io/sebastienrousseau/corral for the MCP registry entry.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Verify release ref

        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Test release source
        run: go test ./...

      # Docker toolchain for the goreleaser dockers: + docker_manifests:
      # sections. QEMU handles arm64 emulation on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless cosign signing uses the same OIDC token our provenance
      # attestations do, so there is no long-lived signing key to leak.
      # goreleaser's docker_signs: block below invokes the installed
      # cosign binary; this step just makes it available on PATH.
      # syft, for the goreleaser `sboms:` block. goreleaser shells out to the
      # syft binary and it is not preinstalled on GitHub runners, so without
      # this the release fails at the SBOM stage with
      # `exec: "syft": executable file not found in $PATH` — after building
      # every archive and package, but before publishing anything.
      # Pinned by commit SHA to match how every other action here is pinned.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      # SLSA build provenance for every artifact goreleaser emitted:
      # tarballs, .deb, .rpm, checksums.txt. The subject-checksums file
      # is generated by goreleaser at dist/checksums.txt; passing it
      # to actions/attest-build-provenance is the fastest way to attest
      # a batch of files in one shot without listing each name here.
      # Users verify with `gh attestation verify <file> --owner sebastienrousseau`.
      #
      # The Docker image published by goreleaser is signed separately via the
      # docker_signs: block in .goreleaser.yaml, which invokes the cosign binary
      # installed above.
      #
      # Note on Scorecard: neither of those feeds the Signed-Releases check, and
      # this comment used to claim they did. That check looks for signature files
      # among the release *assets*; provenance lives in GitHub's attestation store
      # and the image signatures are not release assets. The signs: block added to
      # .goreleaser.yaml emits checksums.txt.sig and .pem as assets, which is what
      # the check reads.
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Publish the MCP registry entry.
      #
      # Without this step server.json was a file nobody read: the registry sat at
      # 0.0.13 from 2026-07-01 while the repo moved through five releases, so the
      # published entry advertised a stale OCI image tag. Bumping the file was
      # never sufficient — nothing shipped it.
      # mcp-publisher is distributed as prebuilt release binaries, not as an
      # installable Go package: `go install .../cmd/mcp-publisher@v1.8.1` fails
      # with "module found, but does not contain package". Download the pinned
      # release asset instead, and verify its Sigstore bundle before running it —
      # this binary publishes on the repository's behalf, so it is exactly the
      # kind of tool that should not be executed unverified. Upstream publishes a
      # .sigstore.json per artifact, so verification costs one command.
      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          asset="mcp-publisher_linux_amd64.tar.gz"
          gh release download "${MCP_PUBLISHER_VERSION}" \
            --repo modelcontextprotocol/registry \
            --pattern "${asset}" --pattern "${asset}.sigstore.json" \
            --dir "${RUNNER_TEMP}"
          cosign verify-blob \
            --bundle "${RUNNER_TEMP}/${asset}.sigstore.json" \
            --certificate-identity-regexp 'https://github.com/modelcontextprotocol/registry/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${RUNNER_TEMP}/${asset}"
          mkdir -p "${RUNNER_TEMP}/mcp-publisher-bin"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}/mcp-publisher-bin"
          echo "${RUNNER_TEMP}/mcp-publisher-bin" >> "${GITHUB_PATH}"

      - name: Publish to the MCP registry
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Fail loudly if server.json was not bumped with the release, rather
          # than silently publishing a mismatched entry.
          declared="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          if [[ "${declared}" != "${version}" ]]; then
            echo "::error::server.json declares ${declared} but the tag is ${version}" >&2
            exit 1
          fi
          # No token gate. `mcp-publisher login github-oidc` authenticates with
          # the GitHub Actions OIDC token, which this job already has via
          # `id-token: write` — it needs no MCP_REGISTRY_TOKEN secret. Gating on
          # that secret meant the step reported success while publishing
          # nothing, which is why the registry sat at 0.0.13 through v0.0.21
          # even after the publisher itself was fixed.
          mcp-publisher login github-oidc
          mcp-publisher publish
