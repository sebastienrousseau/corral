name: Stale

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale
    uses: sebastienrousseau/pipelines/.github/workflows/stale.yml@7061363af0a1da9d60c5901bd2874ac83ff7e34e
    with:
      days-before-stale: 60
      days-before-close: 14
      exempt-issue-labels: 'pinned,security,bug'
      exempt-pr-labels: 'pinned,security'
