name: Dependabot Auto-merge

# Enables GitHub's auto-merge on Dependabot pull requests that fall inside a
# deliberately narrow policy. Auto-merge does not bypass anything: the pull
# request still has to satisfy every branch protection rule on main — all
# thirteen required checks, a signed commit, and an up-to-date branch —
# before GitHub will merge it. This only removes the human click.
#
# Why this exists
#
# main requires branches to be up to date before merging. That is a real
# correctness gate — it stops a pull request passing against a base that has
# since moved — but it means every Dependabot pull request goes stale the
# moment anything else merges. On 2026-08-29, #96 (alpine 3.20 -> 3.24) had
# to be rebased twice for exactly this reason, once because merging #97 moved
# main underneath it. With weekly grouped updates that is recurring toil, and
# toil on a security-update path is how security updates end up sitting.
#
# What is deliberately NOT auto-merged
#
#   - Major version bumps of Go modules. A major bump is a breaking change by
#     definition; a green test suite is evidence, not proof, and this is the
#     one class where reading the changelog is the point.
#   - Anything from an actor other than Dependabot.
#
# What is
#
#   - github-actions and docker updates of any size. Both ecosystems are
#     pinned by SHA or digest here, the diff is a single reference, and
#     Scorecard's Pinned-Dependencies, hadolint and the Trivy image scan all
#     gate them.
#   - Go module patch and minor bumps, which go through CodeQL, gosec,
#     govulncheck, Dependency Review, gitleaks and a 100%-coverage suite on
#     Linux, macOS and Windows before this can act.
#
# The trade-off, stated plainly: a dependency that passes all of that would
# merge without a human reading it. On a repository with no second reviewer
# the alternative is not review — it is the same maintainer clicking merge
# without reading it either. Delete this file to go back to that.
#
# Security note on the trigger
#
# pull_request_target runs with a writable token in the context of the base
# repository. That is only safe because this workflow never checks out or
# executes any code from the pull request; it reads metadata and calls the
# GitHub API. Do not add a checkout step here.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: policy
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail
          eligible=false
          case "${ECOSYSTEM}" in
            github_actions|docker)
              eligible=true
              ;;
            go_modules)
              # An allowlist, not a denylist. fetch-metadata leaves
              # update-type empty for a grouped pull request, and a group can
              # contain a major bump — so "not major" would fail open on
              # exactly the case that most needs a human. Name what is
              # allowed and let everything else fall through to review.
              case "${UPDATE_TYPE}" in
                version-update:semver-patch|version-update:semver-minor)
                  eligible=true
                  ;;
              esac
              ;;
          esac
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"
          echo "ecosystem=${ECOSYSTEM} update=${UPDATE_TYPE} eligible=${eligible}"

      - name: Enable auto-merge
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # A merge commit, matching how every other pull request lands here.
          # GitHub holds this until branch protection is satisfied, and
          # updates the head branch when it falls behind.
          gh pr merge --auto --merge "${PR_URL}"

      - name: Explain why not
        if: steps.policy.outputs.eligible != 'true'
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          echo "::notice::Left for manual review: ${ECOSYSTEM} ${UPDATE_TYPE}."
