name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  go:
    name: Go CI
    permissions:
      contents: read
    uses: sebastienrousseau/pipelines/.github/workflows/go-ci.yml@7061363af0a1da9d60c5901bd2874ac83ff7e34e
    with:
      go-version: '1.26.6'
      run-cross-platform: true
      run-coverage: true

  # The reusable go-ci workflow above does not run the race detector or
  # randomise test order, and a 100%-coverage suite turned out to be
  # order-dependent: `go test -shuffle` failed on 3 of 4 seeds because one test
  # left cobra's help flag set on the package-level rootCmd, so every later test
  # short-circuited into help output and asserted nothing. Both flags are gates
  # here so that class of defect cannot come back silently.
  hardened-tests:
    name: Race & Shuffled Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No actions/setup-go: the runner ships a toolchain, and GOTOOLCHAIN=auto
      # honours the `go` directive in go.mod, so the version is pinned by go.mod
      # rather than by a workflow input that can drift from it. This also keeps
      # the job out of the critical path of a codeload rate-limit on the action
      # tarball, which failed these jobs during "Set up job" — before any step
      # ran — repeatedly on 2026-08-17.
      - name: Test with race detector and randomised order
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go version
          go test -race -shuffle=on ./...
      # Benchmarks are compiled and executed, briefly, on every run. Not to
      # measure anything — runner timings are far too noisy for that — but so
      # a benchmark cannot rot into something that no longer builds or panics
      # on an empty fixture, which is what happens to benchmarks nobody runs.
      - name: Smoke-run benchmarks
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go test -run '^$' -bench . -benchtime 1x ./...

      # Fixed seeds alongside -shuffle=on: a random seed catches ordering bugs
      # eventually, named seeds catch them reproducibly.
      - name: Test with fixed shuffle seeds
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          for seed in 1 2 3; do
            echo "::group::shuffle seed ${seed}"
            go test -count=1 -shuffle="${seed}" ./...
            echo "::endgroup::"
          done

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No actions/setup-go: the runner ships a toolchain, and GOTOOLCHAIN=auto
      # honours the `go` directive in go.mod, so the version is pinned by go.mod
      # rather than by a workflow input that can drift from it. This also keeps
      # the job out of the critical path of a codeload rate-limit on the action
      # tarball, which failed these jobs during "Set up job" — before any step
      # ran — repeatedly on 2026-08-17.
      # govulncheck reports only vulnerabilities that are actually reachable
      # from this module's call graph, including ones in the standard library —
      # which is what a pinned toolchain quietly accumulates between releases.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: auto
          # Pin the install location rather than inferring it. actions/setup-go
          # used to put the Go bin dir on PATH; without it `govulncheck` was
          # installed but not found and the step failed with exit 127 instead of
          # reporting vulnerabilities. Inferring $(go env GOPATH)/bin is not
          # reliable either, because `go install` honours GOBIN when it is set.
          GOBIN: ${{ github.workspace }}/.gobin
        run: |
          set -euo pipefail
          go version
          # govulncheck must be *built* with a toolchain at least as new as the
          # module it analyses. `go install pkg@latest` resolves in its own
          # module context, so it picks the oldest toolchain satisfying x/vuln's
          # own go directive — go1.25.13 — and a scanner built with 1.25 cannot
          # load a module that requires 1.26:
          #   "package requires newer Go version go1.26 (application built with go1.25)"
          # Derive the toolchain from go.mod so this stays a single source of
          # truth and cannot drift the way a hardcoded version would.
          goversion="$(go list -m -f '{{.GoVersion}}')"
          echo "building govulncheck with go${goversion}"
          # Pinned, not @latest. Scorecard's Pinned-Dependencies check flags an
          # unpinned `go install` because whatever @latest resolves to at run
          # time then executes in CI — and this repo pins every action by SHA, so
          # leaving one unpinned tool in the chain is inconsistent. Pinning the
          # scanner does not stale the results: the vulnerability database is
          # fetched from vuln.go.dev at run time, not baked into the binary.
          GOTOOLCHAIN="go${goversion}" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "${GOBIN}/govulncheck" -version
          "${GOBIN}/govulncheck" ./...

  docs-check:
    name: Documentation Coverage Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deliberately no actions/setup-go here.
      #
      # This job needs nothing from setup-go but a toolchain, and the runner
      # already ships one. Depending on the action meant the job could fail
      # during "Set up job" — before any step ran — whenever codeload
      # rate-limited the tarball download, which is exactly what happened
      # repeatedly on 2026-08-17 (429, then 503, then 429 across three
      # attempts and two manual re-runs).
      #
      # GOTOOLCHAIN=auto is Go's default and honours the `go` directive in
      # go.mod, so the version used here is pinned by go.mod rather than by a
      # workflow input that can silently drift away from it. That is stricter
      # than what this job had before, not looser.
      - name: Enforce 100% Doc Coverage
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go version
          go run scripts/doc_coverage.go

      # SBOM.md and server.json are hand-maintained and have both drifted
      # silently before — SBOM.md carried go-github v74 for six releases after
      # go.mod moved to v90, and server.json's version sat at 0.0.13 through
      # five releases. Neither is where the change happens, so review does not
      # catch it. This does.
      - name: Check manifests against go.mod and CHANGELOG
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go run scripts/manifest_check.go

      # The documentation site is only built by the Deploy Docs workflow, on
      # push to main — so a change that breaks the generator was invisible
      # until after it merged. Build it here too, and assert it covers every
      # package `go list` reports: the package list used to be hardcoded, and
      # internal/diag shipped in v0.0.26 without ever reaching the site.
      # The site is built by ssg through the vendored Lucid theme, so the
      # generator now emits Markdown rather than a whole HTML page and these
      # assertions read that instead. The build runs here as well as in the
      # deploy workflow, because a change that breaks it was previously
      # invisible until after it had merged.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install ssg
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .github/ssg-version)"
          cargo binstall --no-confirm "ssg@${version}"

      - name: Build the documentation site
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          # Builds, copies assets, adds heading ids, and fails on a dangling
          # in-page fragment.
          bash scripts/build-docs.sh

          ref="docs-site/content/reference.md"
          missing=0
          # The package list was hardcoded once and internal/diag shipped in
          # v0.0.26 without ever reaching the site, so this compares against
          # what `go list` actually reports.
          for pkg in $(go list ./... | sed 's|github.com/sebastienrousseau/corral/||'); do
            # `--` matters: the pattern starts with a hyphen, and without
            # it grep reads it as an option and reports every package
            # missing, which is a gate that fails whatever you do.
            if ! grep -qF -- "- [${pkg}](#" "${ref}"; then
              echo "::error::${pkg} is missing from the generated documentation site"
              missing=1
            fi
          done
          # Unexported declarations are implementation detail; 173 of them
          # were published once.
          if grep -qE '^#### [a-z_]' "${ref}"; then
            echo "::error::the site is publishing unexported declarations"
            missing=1
          fi
          exit "${missing}"

      # The examples carry `//go:build ignore`, so `go build ./...` skips them
      # and nothing else compiles them either. They could reference a renamed
      # function indefinitely without a single job noticing.
      - name: Compile the examples
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go run scripts/example_check.go
