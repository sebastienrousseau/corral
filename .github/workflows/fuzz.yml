name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

permissions:
  contents: read

jobs:
  fuzz:
    name: Run Fuzz Tests
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No actions/setup-go: GOTOOLCHAIN=auto honours go.mod's `go` directive,
      # and this keeps the job out of the critical path of a codeload rate-limit
      # on the action tarball, which failed it during "Set up job" on 2026-08-17.
      - name: Fuzz NormalizeLanguage
        run: go test -fuzz=FuzzNormalizeLanguage -fuzztime=30s ./internal/engine
      - name: Fuzz EvaluateLayout
        run: go test -fuzz=FuzzEvaluateLayout -fuzztime=30s ./internal/engine
      - name: Fuzz ParseOwnerFromURL
        run: go test -fuzz=FuzzParseOwnerFromURL -fuzztime=30s ./internal/mcp
      # The path sandbox gets the longest budget of the four. A defect in the
      # others is a wrong directory name; a defect here is an agent reading or
      # deleting outside the workspace root, so it earns the extra time.
      - name: Fuzz SafePath sandbox
        run: go test -fuzz=FuzzSafePathNeverEscapesRoot -fuzztime=120s ./internal/mcp
