name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

permissions:
  contents: read

jobs:
  fuzz:
    name: Run Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.1'
      - name: Fuzz NormalizeLanguage
        run: go test -fuzz=FuzzNormalizeLanguage -fuzztime=30s ./internal/engine
      - name: Fuzz EvaluateLayout
        run: go test -fuzz=FuzzEvaluateLayout -fuzztime=30s ./internal/engine
      - name: Fuzz ParseOwnerFromURL
        run: go test -fuzz=FuzzParseOwnerFromURL -fuzztime=30s ./internal/mcp
