# Prose and licence gates.
#
# Cheap checks that catch the things review reliably misses: a typo in a
# heading, a link that 404s after a file moves, a new file with no licence
# header. None of these break the build in any other job, which is exactly
# why they need one of their own — a standard that is not a CI gate decays.
name: Docs Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  spdx:
    name: Licence Headers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # REUSE-style compliance is a property of the whole tree, not of the
      # files someone remembered. Twenty-one workflow and config files had
      # drifted uncovered before this became a gate.
      - name: Every source file carries an SPDX header
        env:
          GOTOOLCHAIN: auto
        run: go run scripts/spdx_sweep.go -check

  markdown:
    name: Markdown & Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: |
            **/*.md
            !docs-site/**
            !public/**

      - name: codespell
        uses: codespell-project/actions-codespell@406322ec52dd7b488e48c1c4b82e2a8b3a1bf630 # v2.1
        with:
          skip: ./.git,./docs-site,./public,./go.sum,./dist,./build,./node_modules
          # intoto  - the in-toto attestation format, spelled correctly
          # statuss - the deliberate typo in the "did you mean" suggestion
          #           tests; correcting it would delete the test case
          # confg   - likewise, a deliberate typo fixture
          # repositor - the stem in `"repositor" + plural(n)`, which builds
          #             "repository"/"repositories" for the summary line
          # unparseable - accepted variant spelling used throughout
          ignore_words_list: intoto,statuss,confg,repositor,unparseable

  links:
    name: Link Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A moved or renamed doc leaves a dead relative link behind and nothing
      # else notices: the file still builds, the site still deploys, and the
      # reader finds the 404. Only internal links are gated — external ones
      # fail for reasons outside this repository's control, so they are
      # reported without failing the build.
      - name: lychee
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --exclude-path docs-site
            --exclude-path public
            --exclude-path dist
            --exclude-path build
            '**/*.md'
          fail: true
