name: Bug report
description: Something Corral did that it should not have, or did not do that it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, **stop** and report it privately through
        [GitHub's private vulnerability reporting](https://github.com/sebastienrousseau/corral/security/advisories/new)
        instead. See [SECURITY.md](https://github.com/sebastienrousseau/corral/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Paste the exact output, not a summary of it.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact command, including flags. Redact tokens and private repository names.
      render: shell
      placeholder: corralctl myorg --languages go --dry-run
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Corral version
      description: Output of `corralctl --version`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - WSL2
    validations:
      required: true

  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Output of `git --version`. Corral shells out to git for every clone and pull.
    validations:
      required: true

  - type: checkboxes
    id: data-loss
    attributes:
      label: Did this lose data?
      description: Repositories deleted, uncommitted work gone, a clone moved somewhere unexpected.
      options:
        - label: Yes — this destroyed or moved something I did not expect
